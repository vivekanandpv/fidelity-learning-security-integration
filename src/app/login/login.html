<div class="col-md-4">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <mat-form-field class="example-full-width">
      <mat-label>Username</mat-label>
      <input type="text" matInput [formControl]="username" [errorStateMatcher]="matcher" />
      <mat-hint>Username</mat-hint>
      @if (username.hasError('required')) {
      <mat-error>Please enter a valid username</mat-error>
      }
    </mat-form-field>

    <mat-form-field class="example-full-width mt-4">
      <mat-label>Password</mat-label>
      <input type="password" matInput [formControl]="password" [errorStateMatcher]="matcher" />
      <mat-hint>Password</mat-hint>
      @if (password.hasError('required')) {
      <mat-error>Please enter a valid password</mat-error>
      }
    </mat-form-field>

    <button matButton="outlined" [disabled]="loginForm.invalid" class="mt-3">Login</button>
  </form>
</div>
